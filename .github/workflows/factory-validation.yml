name: FinancialData Factory - validation et audit

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: read

concurrency:
  group: financialdata-factory-readonly-ci
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact triggering SHA (not floating main)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile factory modules
        run: python -m compileall -q factory
      - name: Unit and negative security tests
        run: python -m unittest discover -s factory/tests -v
      - name: Existing and generated financial-data tests
        run: |
          if [ -d tests ]; then python -m unittest discover -s tests -v; fi
      - name: Create local (unpublished) state snapshot
        run: python -m factory.engine bootstrap > factory-bootstrap.json
      - name: Audit documentary SOURCE and governance
        run: |
          python -m factory.engine audit > factory-audit.json
          python -c 'import json,sys; a=json.load(open("factory-audit.json")); print(json.dumps(a,indent=2)); sys.exit(0 if a["ok"] else 1)'
      - name: Verify universal coding-agent arrival on real repository state
        run: |
          python -m factory.entry --role coder --agent github-ci-arrival > factory-entry.json
          python -c 'import json; e=json.load(open("factory-entry.json")); assert e["entry_contract"]=="FD-AGENT-ARRIVAL-V1"; assert e["read_only"] and e["continuity_id"]=="FD-AUTONOMY-V1"; assert e["decision"] in ("PROGRAM_QUALIFICATION_REQUIRED","APPROVED_WORK_AVAILABLE","CI_ATTESTATION_REQUIRED","NO_ADMISSIBLE_WORK","BLOCKED_BY_AUDIT"); print("Arrival:",e["decision"],"SHA:",e["head_sha"])'
      - name: Archive CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: financialdata-factory-audit
          path: |
            factory-bootstrap.json
            factory-audit.json
            factory-entry.json
          if-no-files-found: warn
          retention-days: 90
